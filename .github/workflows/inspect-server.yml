# サーバ上のどこにアプリ本体が置かれているかを調べるためだけの、一時的なワークフロー。
# 手動実行のみ。読み取り専用のコマンドしか実行しない。確認が済んだら削除する。
name: Inspect server layout

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List directories over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== ~/kitsuenjo-doko.jp ==="
            ls -la ~/kitsuenjo-doko.jp/ 2>&1 | head -30
            echo
            echo "=== public_html の中身 ==="
            ls -la ~/kitsuenjo-doko.jp/public_html/ 2>&1 | head -30
            echo
            echo "=== index.php が読んでいる autoload のパス ==="
            grep -n "autoload\|bootstrap/app" ~/kitsuenjo-doko.jp/public_html/index.php 2>&1
            echo
            echo "=== resources/views を含むディレクトリを探す ==="
            find ~ -maxdepth 4 -type d -name views -path '*resources*' 2>/dev/null | head -20
