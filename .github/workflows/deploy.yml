name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/kitsuenjo-doko.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # public/ しか送っていなかったため、blade を直してもデプロイでは反映
      # されなかった（sitemap の500がその例）。
      #
      # サーバ上の構成は以下。public_html は app/public へのシンボリックリンクで、
      # Laravel 本体は <ドメイン>/app/ に置かれている。
      #   ~/kitsuenjo-doko.jp/app/            ← リポジトリのルート相当
      #   ~/kitsuenjo-doko.jp/public_html  -> app/public
      #
      # 消す操作は一切しない。views の更新だけを届ける。
      # Blade はコンパイル済みビューと元ファイルの更新時刻を比べるので、
      # アップロードすれば次のリクエストで作り直される。
      #
      # 注意: app/ routes/ config/ は対象外なので、コントローラやルートを
      # 変えたときは別途デプロイが要る。
      - name: Deploy views to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './resources/*'
          remote_path: '/home/xs501620/kitsuenjo-doko.jp/app/resources/'
          sftp_only: true
          delete_remote_files: false

      # ビューだけでなくアプリ本体も届ける。以前は public/ と resources/ しか
      # 送っておらず、コントローラやシーダーの変更が本番に反映されなかった。
      - name: Upload app code via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './app/*'
          remote_path: '/home/xs501620/kitsuenjo-doko.jp/app/app/'
          sftp_only: true
          delete_remote_files: false

      - name: Upload routes via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './routes/*'
          remote_path: '/home/xs501620/kitsuenjo-doko.jp/app/routes/'
          sftp_only: true
          delete_remote_files: false

      - name: Upload database files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './database/*'
          remote_path: '/home/xs501620/kitsuenjo-doko.jp/app/database/'
          sftp_only: true
          delete_remote_files: false

      - name: Migrate, load spots and refresh caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/kitsuenjo-doko.jp/app
            PHP=$(command -v php8.3 || command -v php || echo /opt/php-8.3.30/bin/php)
            $PHP artisan migrate --force
            $PHP artisan route:clear
            $PHP artisan view:clear
            $PHP artisan config:clear
            # OpenStreetMap 由来の喫煙所（市区町村つき）。source_ref で upsert する。
            $PHP artisan db:seed --class=OsmSpotSeeder --force
