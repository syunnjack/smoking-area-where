name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/kitsuenjo-doko.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # public/ しか送っていなかったため、blade を直してもデプロイでは反映
      # されなかった（sitemap の500がその例）。アプリ本体は public_html の親に
      # 置かれている（public/index.php が ../vendor/autoload.php を読んでいる）。
      #
      # 消す操作は一切しない。views の更新だけを届ける。
      # Blade はコンパイル済みビューと元ファイルの更新時刻を比べるので、
      # アップロードすれば次のリクエストで作り直される。
      #
      # 注意: app/ routes/ config/ は対象外なので、コントローラやルートを
      # 変えたときは別途デプロイが要る。
      - name: Deploy views to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './resources/*'
          remote_path: '/home/xs501620/kitsuenjo-doko.jp/resources/'
          sftp_only: true
          delete_remote_files: false
